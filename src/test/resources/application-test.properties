# ── The profile the context-load test boots under ────────────────────────────
#
# H2 in MySQL mode, in memory. Not a substitute for testing against MySQL — the
# dialects disagree about enough (reserved words differ in both directions:
# "read" is reserved in MySQL and not H2, "value" in H2 and not MySQL) that a
# green run here is not a promise about production. What it does prove is the
# part that breaks most often and costs most to find late: that every entity
# maps, every repository query parses, every bean wires, and the application
# starts.
#
# NON_KEYWORDS re-permits the identifiers H2 reserves and MySQL does not, so the
# schema Hibernate generates for MySQL is the schema tested here.
spring.datasource.url=jdbc:h2:mem:sujula;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE,READ
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Nothing here should reach the outside world.
spring.mail.host=localhost
spring.mail.port=3025
sujula.auth.data-requests.enabled=false
sujula.admin.bootstrap.enabled=false

# Fixed rather than generated, so a test does not depend on a random key.
sujula.auth.jwt.secret=test-only-signing-key-thirty-two-plus-bytes-long
