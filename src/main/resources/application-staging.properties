# ── Staging: the real services, test credentials ─────────────────────────────
#
#     cp .env.example .env        # then fill it in
#     mvn -o spring-boot:run -Dspring-boot.run.profiles=staging
#
# For testing against the real providers: Neon (PostgreSQL), Gmail for mail,
# Twilio (trial) for SMS, Firebase for push, Cloudflare R2 for images, and
# Stripe in test mode for cards. Every one of them has a free tier that covers
# this.
#
# Every value comes from the environment or from .env in the working
# directory. Each integration is independent: leave a provider's variables
# blank and that provider falls back exactly as it does in dev (texts logged,
# pushes logged, uploads refused with a 400), and everything else still runs.
#
# NOT production. Hibernate still manages the schema, the mock payment gateway
# is on by default, and Swagger UI is served. Deploy under `prod`.

# .env beside the process, read as a properties file. Optional, so a host that
# sets real environment variables needs no file at all. Environment variables
# win over the file.
spring.config.import=optional:file:.env[.properties]

# ── Database: Neon (PostgreSQL) ──────────────────────────────────────────────
# Neon by default. Take the *direct* connection string from the Neon console
# (the host WITHOUT "-pooler") and split it: the JDBC URL carries host, database
# and sslmode; user and password go in their own variables.
#
#   DB_URL=jdbc:postgresql://ep-xxx.eu-central-1.aws.neon.tech/neondb?sslmode=require
#
# For a MySQL instead, set DB_DRIVER=com.mysql.cj.jdbc.Driver and
# DB_DIALECT=org.hibernate.dialect.MySQLDialect.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# Neon suspends the database after a few idle minutes and wakes it on the next
# connection, and free-tier compute is metered while it is awake. A pool that
# keeps idle connections open keeps it awake, so this one drains to zero after
# a minute of quiet. The first request after a suspend waits a moment for the
# wake-up; the 10s connection timeout covers that.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:0}
spring.datasource.hikari.idle-timeout=60000
# Neon closes connections itself when it suspends; recycle before that bites.
spring.datasource.hikari.max-lifetime=300000

# There is no migration tool yet (OPERATIONS §4.1), so Hibernate creates the
# schema here as it does in dev. The database is disposable test data.
spring.jpa.hibernate.ddl-auto=update

# ── Mail (Gmail) ─────────────────────────────────────────────────────────────
# MAIL_USERNAME is the Gmail address; MAIL_PASSWORD is a 16-character App
# Password (Google account → Security → 2-Step Verification → App passwords),
# never the account password. Gmail allows about 500 messages a day.
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.frontend.url=${FRONTEND_URL:http://localhost:5177}

# ── Payments ─────────────────────────────────────────────────────────────────
# Mock stays on until you switch it off. Set PAYMENT_MOCK_ENABLED=false with a
# STRIPE_SECRET_KEY to take card payments through Stripe's test mode instead.
sujula.payment.mock.enabled=${PAYMENT_MOCK_ENABLED:true}

# ── Identity ─────────────────────────────────────────────────────────────────
# Set it, or every token dies on restart. 32+ bytes: openssl rand -base64 48
sujula.auth.jwt.secret=${JWT_SECRET:}

# Codes go by SMS when Twilio is configured, and to the log otherwise. Never in
# the response: this profile talks to real phones.
sujula.auth.phone.expose-code-in-response=false

sujula.security.bootstrap-admin.enabled=true

# ── Transport ────────────────────────────────────────────────────────────────
# Off for testing on http://localhost; turn it on once staging is behind HTTPS.
sujula.cart.cookie-secure=${CART_COOKIE_SECURE:false}

logging.level.com.sujula=INFO

sujula.docs.enabled=true
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.csrf.enabled=true
