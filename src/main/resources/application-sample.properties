# ── The profile that fills the database with sample data ─────────────────────
#
#     mvn -o spring-boot:run -Dspring-boot.run.profiles=sample
#
# and the application starts against whatever database `application.properties`
# points at — a local MySQL by default — with a complete, related dataset
# already in it: every entity populated, and every state each of them can hold.
# See com.sujula.config.seed.SampleDataSeeder.
#
# Nothing here changes the datasource, so this profile layers cleanly on top of
# the ordinary development configuration. Combine it with another profile if you
# want that profile's database instead:
#
#     mvn -o spring-boot:run -Dspring-boot.run.profiles=e2e,sample
#
# It writes nothing when the database already holds users, so restarting is
# safe and repeated starts do not duplicate anything. To seed again, drop the
# schema first — that is meant to be a deliberate act.
#
# NOT a profile to deploy under. The seeded accounts share one published
# password, and the bank details below are encrypted with a key that is in this
# file.

sujula.sample-data.enabled=true

# ── Why a key is set here ────────────────────────────────────────────────────
# Payout destinations go through EncryptedStringConverter, which refuses to
# write anything at all when no key is configured — fail closed, by design. With
# no key the seeder logs what it skipped and carries on; with this one the
# vendor_bank_accounts rows get written like everything else. It is a fixed,
# published test value and must never be a deployment's key.
sujula.security.field-encryption.key=${FIELD_ENCRYPTION_KEY:c3VqdWxhLXNhbXBsZS1kYXRhLWVuY3J5cHRpb24hISE=}

# Card and PayPal have no real provider here, so the paid orders in the sample
# have something consistent to be replayed against.
sujula.payment.mock.enabled=true

logging.level.com.sujula.config.seed=INFO

# ── Background workers, off ──────────────────────────────────────────────────
# These drain queues on a timer, and the sample data is full of rows they would
# happily act on: a webhook waiting to be retried, a catalogue import half
# finished, an export queued, a guest cart past its expiry. Every one of those
# is a state worth being able to look at, and a worker that quietly processes
# them a few seconds after startup means nobody ever sees it. The e2e profile
# switches them off for the same reason.
#
# To watch a worker do its job instead, switch the one you want back on.
sujula.webhooks.enabled=false
sujula.catalogue.jobs.enabled=false
sujula.money.exports.enabled=false
sujula.platform.sweeper.enabled=false
sujula.auth.data-requests.enabled=false
sujula.cart.cleanup.enabled=false
