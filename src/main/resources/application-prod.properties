# ── Production ────────────────────────────────────────────────────────────────
# Everything here comes from the environment. Nothing has a fallback: a missing
# database password should stop the deployment, not start a server that cannot
# serve.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Migrations only. Hibernate must never touch a production schema — it cannot
# drop, rename or roll anything back, and it gives no opportunity to review a
# change before it reaches live data.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# The mock gateway marks orders paid without taking money. It already refuses to
# start under this profile; this is the second lock.
sujula.payment.mock.enabled=false

sujula.cart.cookie-secure=true
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.forward-headers-strategy=native

logging.level.com.sujula=INFO
logging.level.org.hibernate.SQL=WARN

# No anonymous API map in production.
sujula.docs.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
