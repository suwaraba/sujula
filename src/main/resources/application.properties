spring.application.name=Sujula


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your.email@gmail.com
spring.mail.password=yourpassword
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

sujula.google.geocoding.api-key=${GOOGLE_GEOCODING_API_KEY:}
sujula.google.geocoding.base-url=https://maps.googleapis.com/maps/api/geocode/json
sujula.google.geocoding.timeout-ms=3000
sujula.google.geocoding.max-distance-meters=250

sujula.cart.guest-ttl-days=7
sujula.cart.default-currency=GMD
sujula.cart.cleanup.enabled=true
sujula.cart.cleanup.cron=0 17 * * * *

sujula.r2.account-id=${R2_ACCOUNT_ID:}
sujula.r2.access-key-id=${R2_ACCESS_KEY_ID:}
sujula.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
sujula.r2.bucket-name=${R2_BUCKET_NAME:}
sujula.r2.public-url=${R2_PUBLIC_URL:}
sujula.r2.region=${R2_REGION:auto}

# ── Delivery pricing ──────────────────────────────────────────────────────────
# Every amount below is in sujula.delivery.pricing.currency and is converted
# into the buyer's display currency when a quote is returned. Each product is
# priced as its own delivery leg: base + per-km beyond included-km + per-kg
# beyond included-kg, scaled by the product's delivery scope and by how the
# buyer receives it, then clamped to min/max.
sujula.delivery.pricing.currency=GMD
sujula.delivery.pricing.base-fee=50.00
sujula.delivery.pricing.included-km=3
sujula.delivery.pricing.per-km=12.00
sujula.delivery.pricing.included-kg=1
sujula.delivery.pricing.per-kg=25.00
sujula.delivery.pricing.min-fee=50.00
# sujula.delivery.pricing.max-fee=            (unset = uncapped)
sujula.delivery.pricing.default-weight-kg=0.50
# Free delivery once a buyer's goods with one vendor reach this value. Unset = off.
# sujula.delivery.pricing.free-above=2500.00
sujula.delivery.pricing.scope-multiplier.REGIIONAL=1.00
sujula.delivery.pricing.scope-multiplier.RECOGER=0.50
sujula.delivery.pricing.scope-multiplier.NATIONAL=1.40
sujula.delivery.pricing.scope-multiplier.GLOBAL=2.50
sujula.delivery.pricing.mode-multiplier.HOME_DELIVERY=1.00
sujula.delivery.pricing.mode-multiplier.PICKUP_POINT=0.75
sujula.delivery.pricing.mode-multiplier.VENDOR_PICKUP=0.00
# Used only when neither end has usable coordinates and geocoding is unavailable.
sujula.delivery.pricing.fallback-km.REGIIONAL=15
sujula.delivery.pricing.fallback-km.RECOGER=5
sujula.delivery.pricing.fallback-km.NATIONAL=120
sujula.delivery.pricing.fallback-km.GLOBAL=800

# ── Payments ──────────────────────────────────────────────────────────────────
# Shared secret a provider must send as X-Sujula-Signature on /api/payments/callback.
# Blank disables the endpoint outright — never leave it blank in production while
# using an online payment method.
sujula.payment.callback-secret=${PAYMENT_CALLBACK_SECRET:}
sujula.payment.checkout-ttl-minutes=60
# Quoted to buyers who choose bank transfer; bank transfer is offered only once
# name, account name and account number are all set.
sujula.payment.bank-transfer.bank-name=${PAYMENT_BANK_NAME:}
sujula.payment.bank-transfer.account-name=${PAYMENT_BANK_ACCOUNT_NAME:}
sujula.payment.bank-transfer.account-number=${PAYMENT_BANK_ACCOUNT_NUMBER:}
sujula.payment.bank-transfer.branch=${PAYMENT_BANK_BRANCH:}
sujula.payment.bank-transfer.swift=${PAYMENT_BANK_SWIFT:}
