# ── Local development ─────────────────────────────────────────────────────────
# Assumes a MySQL on localhost with a `sujula` database and the credentials
# below. Create it once:
#
#     CREATE DATABASE sujula CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
#
# Override any of it from the environment without editing this file.

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sujula?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Hibernate maintains the schema in dev only, so there is something to run
# against before the Flyway baseline exists. It never drops a column and never
# writes an index you did not annotate — which is exactly why prod does not use
# it. Treat the schema it produces as disposable.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Card and PayPal have no real provider yet. This marks those orders PAID
# without any money moving, so the paid-order path can be exercised at all.
# It refuses to start under the prod profile.
sujula.payment.mock.enabled=true

# Local development is plain HTTP, so a Secure cookie would never be sent back.
sujula.cart.cookie-secure=false

# Gives you an administrator to sign in as. The password is logged once on the
# first start if you do not set one.
sujula.security.bootstrap-admin.enabled=true
sujula.security.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@sujula.gm}

logging.level.com.sujula=DEBUG
