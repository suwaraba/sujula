# ── Local development ─────────────────────────────────────────────────────────
# Assumes a MySQL on localhost with the credentials below. The `sujula` schema
# is created on first connect (createDatabaseIfNotExist), so there is no setup
# step to forget — a missing schema was otherwise reported as a dialect error
# with the real cause buried in the log.
#
# Override any of it from the environment without editing this file.

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sujula?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

# Hibernate maintains the schema in dev only, so there is something to run
# against before the Flyway baseline exists. It never drops a column and never
# writes an index you did not annotate — which is exactly why prod does not use
# it. Treat the schema it produces as disposable.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Card and PayPal have no real provider yet. This marks those orders PAID
# without any money moving, so the paid-order path can be exercised at all.
# It refuses to start under the prod profile.
sujula.payment.mock.enabled=true

# Local development is plain HTTP, so a Secure cookie would never be sent back.
sujula.cart.cookie-secure=false

# Gives you an administrator to sign in as. The password is logged once on the
# first start if you do not set one.
sujula.security.bootstrap-admin.enabled=true
sujula.security.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@sujula.gm}

# Object storage is left unset on purpose. Uploading a product image is the only
# thing that needs it, so local work does not require Cloudflare credentials —
# the upload endpoints return a 400 explaining what to set, and everything else
# runs. Fill these in when you need to test image upload for real.
# sujula.r2.account-id=
# sujula.r2.access-key-id=
# sujula.r2.secret-access-key=
# sujula.r2.bucket-name=
# sujula.r2.public-url=

logging.level.com.sujula=DEBUG

# Swagger UI at http://localhost:8080/swagger-ui.html — the endpoint surface,
# browsable and callable. Off by default everywhere else: the OpenAPI document
# maps every path and request shape, which is not something to serve anonymously
# in production.
sujula.docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
# Makes Swagger UI read the XSRF-TOKEN cookie and send it back as the header, so
# its "Try it out" button works on writes instead of returning 403.
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
