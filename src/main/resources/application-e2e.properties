# ── The profile the end-to-end collection runs against ───────────────────────
#
# One command, no database to install, no credentials to obtain:
#
#     mvn -o spring-boot:run -Dspring-boot.run.profiles=e2e
#
# and the whole application is answering on :8080 with the development seed
# already in it. That is the entire reason this file exists. A test collection
# that needs a MySQL, a Google key, an SMTP host and a Cloudflare bucket before
# it can make its first request is a collection nobody runs, and the endpoints
# it would have covered stay uncovered.
#
# It is NOT a substitute for running against MySQL. H2 in MySQL mode disagrees
# with the real thing about reserved words and about a few date functions, so a
# green collection here is a statement about the application's behaviour and not
# a statement about the schema. Point DB_URL at a MySQL and re-run the same
# collection when that is the question being asked.
#
# Every secret below is a fixed, published test value. That is deliberate and it
# is why this profile must never be the one a deployment starts under: the JWT
# key is in a file in the repository, so anybody holding the repository can mint
# a token for any account. See application-prod.properties, which takes all of
# these from the environment and refuses to start without them.

# ── Database ─────────────────────────────────────────────────────────────────
# NON_KEYWORDS re-permits the two identifiers H2 reserves and MySQL does not, so
# the schema generated here is the schema the application maps in production.
spring.datasource.url=jdbc:h2:mem:sujula-e2e;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE,READ
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# The seed is loaded by E2eSeedLoader, which exists only under this profile.
# CLAUDE.md is right that seed data appearing by surprise is worse than typing
# one command — but this profile IS that command: its whole purpose is a
# populated server for a test run, and a collection that asserts on Fatou's
# orders needs Fatou to exist before the first request rather than after
# somebody remembers.
#
# Not spring.sql.init: the seed opens with START TRANSACTION, which is valid
# MySQL and has no H2 grammar. See that class for why the seed is not the thing
# that gets rewritten.

# ── Identity ─────────────────────────────────────────────────────────────────
# Fixed rather than generated, so a token minted by one run is still valid after
# a restart and a collection does not have to sign everybody in again mid-flight.
sujula.auth.jwt.secret=e2e-only-signing-key-thirty-two-plus-bytes-long-do-not-deploy
sujula.auth.jwt.issuer=sujula-e2e
# Long enough that a full collection run never has a token expire underneath it.
sujula.auth.jwt.access-token-ttl=2h

# Returns the code in the response instead of sending it. There is no SMS sender
# on this platform at all, so without this the phone-verification endpoints are
# untestable rather than merely inconvenient — the code would exist only in a
# row nobody outside the application can read.
sujula.auth.phone.expose-code-in-response=true
sujula.auth.phone.max-per-hour=100

# The seed carries its own administrator (Fatou, 1001) and its own support agent
# (Binta, 1012). Bootstrapping another one would add a second ADMIN the
# collection does not know about, and every "how many administrators are there"
# assertion would be off by one.
sujula.security.bootstrap-admin.enabled=false

# ── Money ────────────────────────────────────────────────────────────────────
# No card provider is integrated, so this marks those orders PAID without money
# moving. Without it every checkout in the collection stops at PENDING_PAYMENT
# and the entire post-payment half of this application — fulfilment, custody,
# payouts, refunds — is unreachable.
sujula.payment.mock.enabled=true
sujula.payment.callback-secret=e2e-payment-callback-secret
sujula.payment.bank-transfer.bank-name=Trust Bank Gambia
sujula.payment.bank-transfer.account-name=Sujula Marketplace Ltd
sujula.payment.bank-transfer.account-number=001234567890
sujula.payment.bank-transfer.branch=Kairaba Avenue
sujula.payment.bank-transfer.swift=TBLGGMGM

# Base64 of exactly 32 bytes. Unset, PUT /vendor/stores/{id}/bank-account
# refuses rather than storing an account number in clear — correct behaviour,
# and it would make that endpoint impossible to exercise here.
sujula.security.field-encryption.key=c3VqdWxhLWUyZS1maWVsZC1lbmNyeXB0aW9uLWtleSE=

# ── Webhooks ─────────────────────────────────────────────────────────────────
# A provider with no secret is refused, which is the right default and also
# means an unconfigured provider cannot be tested past its 401. These four are
# the providers the collection signs as. `unconfigured` is deliberately absent
# from this list: the collection posts to it to prove that the refusal holds.
sujula.webhooks.secrets.stripe=e2e-stripe-webhook-secret
sujula.webhooks.secrets.wave=e2e-wave-webhook-secret
sujula.webhooks.secrets.postmark=e2e-postmark-webhook-secret
sujula.webhooks.secrets.smile=e2e-smile-webhook-secret

# ── Links and documents ──────────────────────────────────────────────────────
# Fixed so an invoice link survives a restart, and absolute so the collection
# can follow it without reassembling a host.
sujula.invoice.signing-secret=e2e-invoice-signing-secret
sujula.invoice.base-url=http://localhost:8080
app.frontend.url=http://localhost:8080

# ── Everything that reaches outside this process ─────────────────────────────
# Pointed at a closed port with short timeouts rather than left unset. Mail is
# sent on an @Async thread and the failure is caught and logged, so this costs
# nothing; what it buys is a run that behaves identically whether or not the
# machine happens to have something listening on 25.
spring.mail.host=127.0.0.1
spring.mail.port=1
spring.mail.properties.mail.smtp.connectiontimeout=500
spring.mail.properties.mail.smtp.timeout=500
spring.mail.properties.mail.smtp.writetimeout=500

# No key, so addresses geocode by the degraded path and report NONE confidence.
# That is a real behaviour worth covering, and the collection asserts on it.
sujula.google.geocoding.api-key=

# Object storage is left unset. The upload endpoints answer 400 with what to
# set, which is itself the assertion the collection makes about them.
sujula.r2.account-id=
sujula.r2.access-key-id=
sujula.r2.secret-access-key=
sujula.r2.bucket-name=
sujula.r2.public-url=

# Plain HTTP locally, so a Secure cookie would be set and never sent back — the
# guest-cart half of the collection would fail on its second request.
sujula.cart.cookie-secure=false

# ── Background work ──────────────────────────────────────────────────────────
# Off. A worker that drains a queue on a timer makes a collection
# non-deterministic: whether a bulk import has finished when the next request
# asks depends on how long the previous request took. The collection triggers
# these through POST /admin/jobs/{job}/run instead, which is an endpoint it
# should be covering anyway.
sujula.catalogue.jobs.enabled=false
sujula.cart.cleanup.enabled=false

# ── The surface itself ───────────────────────────────────────────────────────
# Swagger UI on http://localhost:8080/swagger-ui.html, and the OpenAPI document
# at /openapi.json — which is what the collection is generated from, so it is
# not optional here.
sujula.docs.enabled=true
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/swagger-ui.html

server.port=${E2E_PORT:8080}
logging.level.com.sujula=INFO
logging.level.org.springframework.jdbc.datasource.init=INFO
