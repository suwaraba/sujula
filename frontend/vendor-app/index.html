<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover is what makes env(safe-area-inset-*) report real
      numbers inside the native shell; without it the tab bar sits under an
      iPhone's home indicator.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b6b52" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f151c" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Sujula for sellers — your shop, your orders, your money." />
    <!--
      The seller's surface holds order details and a collection code. It has no
      business in a search index or a referrer sent to another site.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="same-origin" />
    <title>Sujula for sellers</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Sujula for sellers needs JavaScript to run.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
