<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#0B1220" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sujula Driver" />

    <!--
      Nothing on this surface belongs in anybody else's index, and a driver's
      screen carries recipients' addresses. The app is also never linked to
      publicly: it is installed from a link dispatch sends.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="same-origin" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <title>Sujula Driver</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      This app needs JavaScript. Ask dispatch to call you instead — the number
      is on the card in your wallet.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
