<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  viewport-fit=cover, because this same file is what the Android and iOS
  wrappers load. Without it the bottom tab bar sits under the home indicator
  on a notched phone, and the top bars sit under the status bar.
-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08201a" media="(prefers-color-scheme: dark)">
<meta name="description" content="Buy from sellers at home, pay from where you are, and have it delivered to whoever it is for.">
<meta name="format-detection" content="telephone=no">
<title>Sujula</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to the products</a>

<header class="chrome">
  <!--
    Bar one: how to reach a person. A marketplace whose buyers are abroad and
    whose recipients are not lives or dies on somebody answering WhatsApp, so
    the number is the first thing on the page rather than something buried in
    a footer. Filled from /config/public, which is where support's real
    numbers live.
  -->
  <div class="contactbar" id="contact-bar" data-testid="contact-bar"></div>

  <!-- Bar two: the shop. Logo, the search field, and the icons. -->
  <div class="mainbar" id="main-bar" data-testid="main-bar"></div>

  <!-- Where the parcel is going. Not where the buyer is: the two differ. -->
  <div id="delivery-strip"></div>
</header>

<main id="main" tabindex="-1"></main>

<footer id="site-footer"></footer>

<!-- The phone's bottom tab bar. Hidden on wide screens, which have the icons. -->
<nav class="tabbar" id="tab-bar" aria-label="Main"></nav>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
